name: FHIR validation

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-validation:
    name: HL7 Java validator
    uses: medizininformatik-initiative/mii-kds-module-template/.github/workflows/ci_java_validation.yml@15e4e79a5cb5249e263199db0bdc7a6729015afe # mii-kds-module-template dev @ 2026-11-02 (includes #46, #48)
    with:
      ref: ${{ github.ref }}
      PATH_TO_CONFORMANCE_RESOURCES: fsh-generated/resources
      PATH_TO_EXAMPLES: fsh-generated/resources
      JAVA_VALIDATION_ENABLED: true
      # Marked required in the reusable workflow, so it must be passed; keep in line with its default.
      JAVA_VALIDATOR_VERSION: "6.10.4"
      JAVA_VALIDATION_OPTIONS: "-advisor-file advisor.json"
      # Pinned SUSHI, same as the template's validation.yml; overridable via the repo variable.
      SUSHI_VERSION: ${{ vars.SUSHI_VERSION || '3.21.0' }}
      SNAPSHOT_DEPENDENCIES: true
    secrets: inherit
